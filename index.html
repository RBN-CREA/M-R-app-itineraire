<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="Mariana & Robin se marient le 15 mai 2027 au Domaine Monmanoir.">
<meta name="theme-color" content="#9CAF9B">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; script-src 'self' 'unsafe-inline'; connect-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'">
<meta property="og:title" content="Mariana & Robin — 15 mai 2027">
<meta property="og:description" content="Notre mariage au Domaine Monmanoir.">
<meta property="og:type" content="website">
<meta name="robots" content="noindex, nofollow">
<title>Mariana &amp; Robin — 15 mai 2027</title>
<script src="lang.js"></script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="asset/icon-192.png">
<link rel="apple-touch-icon" href="asset/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Parisienne&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --creme:#F4EBD9;
    --papier:#FBF6EC;
    --terracotta:#C66B49;
    --or:#E8A856;
    --bleu:#A4C3D2;
    --sauge:#9CAF9B;
    --sauge-fonce:#7F9A80;
    --encre:#5B4636;
    --encre-douce:#8A7A64;
    --ligne:#EAD9BE;
    --ombre: 0 24px 50px -24px rgba(91,70,54,0.38);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Jost', sans-serif;
    color:var(--encre);
    min-height:100vh;
    min-height:100dvh;
    display:flex; align-items:center; justify-content:center;
    padding:24px 12px;
    background:
      radial-gradient(ellipse 70% 50% at 12% 8%, rgba(164,195,210,0.42), transparent 55%),
      radial-gradient(ellipse 60% 45% at 92% 88%, rgba(232,168,86,0.28), transparent 50%),
      radial-gradient(ellipse 40% 35% at 70% 20%, rgba(156,175,155,0.22), transparent 45%),
      var(--creme);
  }

  .shell{
    width:100%; max-width:460px;
    background:var(--papier);
    border-radius:26px;
    box-shadow:var(--ombre);
    border:1px solid var(--ligne);
    padding:52px 32px 36px;
    text-align:center;
    position:relative;
    overflow:hidden;
    opacity:0;
    transform:translateY(18px);
    animation:rise-in .9s cubic-bezier(.22,1,.36,1) .08s forwards;
  }
  @keyframes rise-in{
    to{ opacity:1; transform:translateY(0); }
  }

  @media (max-width: 560px){
    body{ padding:0; align-items:stretch; }
    .shell{
      max-width:100%; width:100%;
      border-radius:0; border:none; box-shadow:none;
      padding-top:calc(52px + env(safe-area-inset-top));
      padding-bottom:calc(36px + env(safe-area-inset-bottom));
      min-height:100dvh;
      display:flex; flex-direction:column; justify-content:center;
    }
  }

  .frame-corner{
    position:absolute;
    width:min(28vw, 130px);
    height:auto;
    pointer-events:none;
    z-index:50;
    opacity:0;
    animation:fade-frame 1.1s ease .35s forwards;
  }
  @keyframes fade-frame{ to{ opacity:1; } }
  .frame-corner.tl{ top:0; left:0; }
  .frame-corner.tr{ top:0; right:0; }
  .frame-corner.bl{ bottom:0; left:0; width:min(15vw, 70px); }
  .frame-corner.br{ bottom:0; right:0; width:min(24vw, 112px); }
  .frame-sprig{
    position:absolute;
    right:0; top:55%;
    width:min(9vw, 42px);
    height:auto;
    pointer-events:none;
    z-index:50;
    opacity:0;
    animation:fade-frame 1.1s ease .5s forwards;
  }

  h1{
    font-family:'Parisienne', cursive;
    font-weight:400;
    font-size:clamp(32px, 8vw, 40px);
    margin:0 0 6px;
    color:var(--encre);
    line-height:1.15;
  }
  .venue{
    font-size:11px; letter-spacing:0.24em; text-transform:uppercase;
    color:var(--terracotta); opacity:0.9; margin-bottom:28px;
  }

  .eyebrow{
    font-size:11px; letter-spacing:0.2em; text-transform:uppercase;
    color:var(--encre-douce); margin-bottom:14px;
  }

  .countdown{
    display:flex; justify-content:center; gap:8px; margin-bottom:26px;
  }
  .unit{
    padding:6px 6px 4px;
    min-width:64px;
    flex:1;
    max-width:78px;
  }
  .unit .num{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-size:30px;
    color:var(--terracotta);
    line-height:1;
    font-variant-numeric: tabular-nums;
  }
  .unit .label{
    font-size:9.5px; letter-spacing:0.08em; text-transform:uppercase;
    color:var(--encre-douce); margin-top:6px;
  }

  .date-line{
    font-family:'Cormorant Garamond', serif;
    font-size:20px; font-weight:600;
    color:var(--encre);
    margin-bottom:8px;
  }
  .sub-msg{
    font-size:13px; color:var(--encre-douce); line-height:1.65;
    max-width:320px; margin:0 auto 28px;
  }

  .actions{
    display:flex; flex-direction:column; gap:10px;
    max-width:280px; margin:0 auto;
  }
  .btn{
    appearance:none; border:none; cursor:pointer;
    font-family:'Jost', sans-serif; font-weight:600; font-size:13px;
    letter-spacing:0.04em;
    padding:13px 18px;
    border-radius:999px;
    transition: transform .15s ease, background .15s ease, color .15s ease, border-color .15s ease;
  }
  .btn:active{ transform:scale(0.97); }
  .btn-primary{
    background:var(--sauge-fonce);
    color:var(--papier);
  }
  .btn-primary:hover{ background:var(--sauge); }
  .btn-ghost{
    background:transparent;
    color:var(--encre);
    border:1px solid var(--ligne);
  }
  .btn-ghost:hover{ border-color:var(--terracotta); color:var(--terracotta); }

  .sr-only{
    position:absolute; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
  }

  /* Le jour J : étape en cours à la place du compte à rebours */
  .now[hidden], .countdown[hidden]{ display:none; }
  .now{ margin:0 0 26px; animation:rise-in .5s ease both; }
  .now-name{ font-family:'Parisienne', cursive; font-weight:400; font-size:46px; line-height:1.1; color:var(--terracotta); margin:2px 0 8px; }
  .now-desc{ font-size:14px; line-height:1.5; color:var(--encre-douce); max-width:300px; margin:0 auto; }

  .enter-note{ margin:2px 0 0; font-size:13px; line-height:1.5; color:var(--encre-douce); }
  .enter-note[hidden]{ display:none; }
  .sheet[hidden]{ display:none; }
  .sheet{ position:fixed; inset:0; z-index:100; background:rgba(91,70,54,0.35); display:flex; align-items:flex-end; justify-content:center; padding:16px; animation:fade-in .2s ease; }
  .sheet-card{ width:100%; max-width:380px; background:var(--papier); border-radius:22px; padding:22px 20px 18px; text-align:center; box-shadow:var(--ombre); display:flex; flex-direction:column; gap:10px; margin-bottom:env(safe-area-inset-bottom); }
  .sheet-card h2{ font-family:'Cormorant Garamond', serif; font-size:22px; font-weight:600; margin:0; color:var(--encre); }
  .sheet-card p{ font-size:13px; line-height:1.5; color:var(--encre-douce); margin:0 0 6px; }
  .sheet-card .btn{ text-decoration:none; text-align:center; }
  @keyframes fade-in{ from{ opacity:0; } to{ opacity:1; } }

  @media (max-width:420px){
    .unit .num{ font-size:24px; }
  }

  .lang-switch{position:relative; z-index:60; display:inline-flex; gap:2px; padding:3px; background:rgba(255,255,255,0.75); border:1px solid var(--ligne,#EAD9BE); border-radius:999px; box-shadow:0 2px 8px rgba(91,70,54,0.12);}
  .lang-switch button{appearance:none; border:0; background:transparent; cursor:pointer; display:flex; align-items:center; gap:6px; font:600 13px 'Jost',sans-serif; letter-spacing:0.06em; color:#5B4636; padding:6px 12px; border-radius:999px;}
  .lang-switch button .fl{font-size:18px; line-height:1;}
  .lang-switch button[aria-pressed="true"]{background:#7F9A80; color:#FBF6EC;}
  .lang-top{position:absolute; top:calc(12px + env(safe-area-inset-top)); left:0; right:0; display:flex; justify-content:center; z-index:60; pointer-events:none;}
  .lang-top .lang-switch{pointer-events:auto; padding:2px; gap:0; background:rgba(255,255,255,0.55); box-shadow:none; opacity:0.85;}
  .lang-top .lang-switch button{font-size:10px; gap:4px; padding:3px 8px;}
  .lang-top .lang-switch button .fl{font-size:12px;}
  @media (prefers-reduced-motion: reduce){
    .shell, .frame-corner, .frame-sprig{ animation:none; opacity:1; transform:none; }
  }
</style>
</head>
<body>

  <main class="shell">
    <img class="frame-corner tl" src="asset/corner-tl.png" alt="" width="130" height="130">
    <img class="frame-corner tr" src="asset/corner-tr.png" alt="" width="130" height="130">
    <img class="frame-corner bl" src="asset/corner-bl.png" alt="" width="70" height="70">
    <img class="frame-corner br" src="asset/corner-br.png" alt="" width="112" height="112">
    <img class="frame-sprig" src="asset/sprig-right.png" alt="" width="42" height="120">

    <h1 id="brandTitle">Mariana &amp; Robin</h1>
    <div class="lang-top"><div class="lang-switch"></div></div>
    <div class="venue">Domaine Monmanoir</div>

    <p class="eyebrow" id="countdownEyebrow" data-i18n="eyebrowCountdown">Le grand jour arrive dans</p>

    <div class="countdown" id="countdown" role="timer" aria-live="polite" aria-atomic="true">
      <div class="unit"><div class="num" id="cd-days">00</div><div class="label" data-i18n="days">jours</div></div>
      <div class="unit"><div class="num" id="cd-hours">00</div><div class="label" data-i18n="hours">heures</div></div>
      <div class="unit"><div class="num" id="cd-mins">00</div><div class="label" data-i18n="mins">min</div></div>
      <div class="unit"><div class="num" id="cd-secs">00</div><div class="label" data-i18n="secs">sec</div></div>
    </div>

    <div class="now" id="now" hidden>
      <div class="now-name" id="nowName"></div>
      <p class="now-desc" id="nowDesc"></p>
    </div>

    <div class="date-line" data-i18n="dateShort">15 mai 2027</div>
    <p class="sub-msg" id="subMsg" data-i18n="subMsg">Retrouvez ici le plan, les horaires et l'itinéraire du jour J.</p>

    <div class="actions">
      <a class="btn btn-primary" id="enterBtn" href="itineraire-v4.html" style="text-decoration:none;text-align:center" data-i18n="enter">Entrer</a>
      <p class="enter-note" id="enterNote" hidden></p>
      <button type="button" class="btn btn-ghost" id="routeBtn" data-i18n="route">Itinéraire</button>
    </div>
  </main>

  <div class="sheet" id="routeSheet" hidden>
    <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="routeTitle">
      <h2 id="routeTitle" data-i18n="openWith">Ouvrir l'itinéraire avec</h2>
      <p>Domaine Monmanoir<br>6 Rue de Paris, 95680 Montlignon</p>
      <a class="btn btn-primary" href="https://www.google.com/maps/dir/?api=1&destination=Domaine%20Monmanoir%2C%206%20Rue%20de%20Paris%2C%2095680%20Montlignon" target="_blank" rel="noopener">Google Maps</a>
      <a class="btn btn-primary" href="https://waze.com/ul?q=Domaine%20Monmanoir%2C%206%20Rue%20de%20Paris%2C%2095680%20Montlignon&navigate=yes" target="_blank" rel="noopener">Waze</a>
      <button type="button" class="btn btn-ghost" id="routeCancel" data-i18n="cancel">Annuler</button>
    </div>
  </div>

  <span class="sr-only" id="cdAnnounce" aria-live="polite"></span>

<script>
(function(){
  'use strict';

  const TARGET_DATE = new Date('2027-05-15T13:30:00+02:00');
  const pad = n => String(n).padStart(2, '0');

  /* Étapes du jour J (heure de Paris) */
  const WEDDING_DATE = '2027-05-15';
  const STAGE_IDS = ['arrivee','ceremonie','cocktail','diner','soiree','retour'];
  const STAGES = [
    {time:'13:30', id:'arrivee'},
    {time:'14:00', id:'ceremonie'},
    {time:'15:00', id:'cocktail'},
    {time:'19:00', id:'diner'},
    {time:'22:00', id:'soiree'},
    // Lendemain (dimanche 16 mai)
    {time:'11:00', day:1, id:'retour'}
  ];
  // Pour tester : ?heure=15:30 simule le jour J à cette heure.
  const FAKE_TIME = new URLSearchParams(location.search).get('heure');
  function parisNow(){
    if(FAKE_TIME && /^\d{1,2}:\d{2}$/.test(FAKE_TIME)){
      const [h,m] = FAKE_TIME.split(':').map(Number);
      return { date:WEDDING_DATE, min:h*60+m };
    }
    const p = Object.fromEntries(new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Paris',
      year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'})
      .formatToParts(new Date()).map(x=>[x.type,x.value]));
    return { date:`${p.year}-${p.month}-${p.day}`, min:(+p.hour)*60 + (+p.minute) };
  }
  // Fin du week-end : dimanche 16 mai à 14h ; ensuite, remerciement et photos
  const END_MIN = 38 * 60;
  function minutesSinceWeddingDayStart(){
    const n = parisNow();
    const days = Math.round((Date.UTC(...n.date.split('-').map((v,i)=>i===1?v-1:+v)) - Date.UTC(...WEDDING_DATE.split('-').map((v,i)=>i===1?v-1:+v))) / 86400000);
    return days*1440 + n.min;
  }
  function partyOver(){ return minutesSinceWeddingDayStart() >= END_MIN; }
  function currentStageIndex(){
    const m = minutesSinceWeddingDayStart();
    let cur = 0;
    STAGES.forEach((st,i)=>{ const [h,mm] = st.time.split(':').map(Number); if(m >= (st.day||0)*1440 + h*60+mm) cur = i; });
    return cur;
  }

  function updateCountdown(){
    const now = new Date();
    let diff = FAKE_TIME ? 0 : TARGET_DATE - now;
    const eyebrow = document.getElementById('countdownEyebrow');
    const sub = document.getElementById('subMsg');

    if(diff <= 0){
      // Compte à rebours terminé : étape en cours, puis remerciement une fois la fête finie
      document.getElementById('countdown').hidden = true;
      document.getElementById('now').hidden = false;
      const enter = document.getElementById('enterBtn');
      const extra = FAKE_TIME ? '&heure=' + encodeURIComponent(FAKE_TIME) : '';
      if(partyOver()){
        document.getElementById('nowName').textContent = t('thanks');
        document.getElementById('nowDesc').textContent = t('thanksDesc');
        eyebrow.textContent = t('eyebrowThanks');
        sub.textContent = t('subThanks');
        enter.setAttribute('href', 'https://photos-mariage-umber.vercel.app/');
        enter.textContent = t('photos');
        const note = document.getElementById('enterNote');
        note.textContent = t('photosNote');
        note.hidden = false;
        document.getElementById('routeBtn').hidden = true;
      } else {
        const i = currentStageIndex(), st = STAGES[i];
        document.getElementById('nowName').textContent = t('n.' + st.id);
        document.getElementById('nowDesc').textContent = t('d.' + st.id);
        eyebrow.textContent = t('eyebrowNow');
        sub.textContent = t('subNow');
        // « Entrer » ouvre directement la page de l'étape en cours
        enter.setAttribute('href', 'itineraire-v4.html?etape=' + i + extra);
      }
      return;
    }

    const days = Math.floor(diff / 86400000);
    const hours = Math.floor((diff / 3600000) % 24);
    const mins = Math.floor((diff / 60000) % 60);
    const secs = Math.floor((diff / 1000) % 60);

    document.getElementById('cd-days').textContent = String(days);
    document.getElementById('cd-hours').textContent = pad(hours);
    document.getElementById('cd-mins').textContent = pad(mins);
    document.getElementById('cd-secs').textContent = pad(secs);

    if(days <= 7){
      eyebrow.textContent = t('eyebrowFew');
      sub.textContent = t('subFew');
    }
  }

  /* Itinéraire : choix Maps / Waze */
  const sheet = document.getElementById('routeSheet');
  const openSheet = () => { sheet.hidden = false; };
  const closeSheet = () => { sheet.hidden = true; };
  document.getElementById('routeBtn').addEventListener('click', openSheet);
  document.getElementById('routeCancel').addEventListener('click', closeSheet);
  sheet.addEventListener('click', e => { if(e.target === sheet) closeSheet(); });
  sheet.querySelectorAll('a').forEach(a => a.addEventListener('click', closeSheet));
  document.addEventListener('keydown', e => { if(e.key === 'Escape') closeSheet(); });

  updateCountdown();
  setInterval(updateCountdown, 1000);
})();
</script>

<script>if('serviceWorker' in navigator && location.protocol!=='file:'){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}</script>
</body>
</html>
