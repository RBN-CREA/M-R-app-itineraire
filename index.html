<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Mariana &amp; Robin — 15 mai 2027</title>
<meta name="theme-color" content="#C66B49">
<meta name="description" content="Mariana &amp; Robin — 15 mai 2027 — Domaine Monmanoir">
<meta property="og:title" content="Mariana &amp; Robin — 15 mai 2027">
<meta property="og:description" content="Toutes les infos pratiques de notre mariage au Domaine Monmanoir.">
<meta property="og:type" content="website">
<meta property="og:image" content="asset/icon-512.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="asset/icon-192.png">
<link rel="apple-touch-icon" href="asset/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Parisienne&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --creme:#F4EBD9;
    --papier:#FBF6EC;
    --terracotta:#C66B49;
    --or:#E8A856;
    --bleu:#A4C3D2;
    --sauge:#9CAF9B;
    --encre:#5B4636;
    --ombre: 0 20px 45px -20px rgba(91,70,54,0.35);
  }
  [hidden]{display:none !important;}
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Jost', sans-serif;
    color:var(--encre);
    min-height:100vh;
    min-height:100dvh;
    display:flex; align-items:center; justify-content:center;
    padding:24px 12px;
    background:
      radial-gradient(circle at 15% 15%, rgba(164,195,210,0.35), transparent 45%),
      radial-gradient(circle at 85% 85%, rgba(232,168,86,0.25), transparent 45%),
      var(--creme);
  }

  .card{
    width:100%; max-width:460px;
    background:var(--papier);
    border-radius:26px;
    box-shadow:var(--ombre);
    border:1px solid #EAD9BE;
    padding:58px 32px 36px;
    text-align:center;
    position:relative;
    overflow:hidden;
  }

  @media (max-width: 560px){
    body{
      padding:0;
      align-items:stretch;
    }
    .card{
      max-width:100%;
      width:100%;
      border-radius:0;
      border:none;
      box-shadow:none;
      padding-top:calc(58px + env(safe-area-inset-top));
      padding-bottom:calc(36px + env(safe-area-inset-bottom));
    }
  }

  /* Ornements floraux (mêmes fichiers que sur le reste du site) */
  .frame-corner{
    position:absolute;
    width:min(28vw, 130px);
    height:auto;
    pointer-events:none;
    z-index:50;
  }
  .frame-corner.tl{ top:0; left:0; }
  .frame-corner.tr{ top:0; right:0; }
  .frame-corner.bl{ bottom:0; left:0; width:min(15vw, 70px); }
  .frame-corner.br{ bottom:0; right:0; width:min(24vw, 112px); }
  .frame-sprig{
    position:absolute;
    right:0;
    top:55%;
    width:min(9vw, 42px);
    height:auto;
    pointer-events:none;
    z-index:50;
  }

  .logo{
    width:84px; height:84px; object-fit:contain;
    margin:0 auto 18px;
    display:block;
  }

  h1{
    font-family:'Parisienne', cursive;
    font-weight:400;
    font-size:34px;
    margin:0 0 6px;
    color:var(--encre);
  }
  .venue{
    font-size:11px; letter-spacing:0.24em; text-transform:uppercase;
    color:var(--terracotta); opacity:0.85; margin-bottom:30px;
  }

  .eyebrow{
    font-size:11px; letter-spacing:0.2em; text-transform:uppercase;
    color:#8A7A64; margin-bottom:14px;
  }

  .countdown{
    display:flex; justify-content:center; gap:10px; margin-bottom:28px;
  }
  .unit{
    padding:0;
    min-width:64px;
    flex:1;
    max-width:78px;
  }
  .unit .num{
    font-family:'Cormorant Garamond', serif;
    font-weight:600;
    font-size:30px;
    color:var(--terracotta);
    line-height:1;
    font-variant-numeric: tabular-nums;
  }
  .unit .label{
    font-size:9.5px; letter-spacing:0.08em; text-transform:uppercase;
    color:#8A7A64; margin-top:5px;
  }

  .date-line{
    font-family:'Cormorant Garamond', serif;
    font-size:18px; font-weight:600;
    color:var(--encre);
    margin-bottom:6px;
  }
  .sub-msg{
    font-size:12.5px; color:#8A7A64; line-height:1.6;
    max-width:320px; margin:0 auto;
  }

  /* --- Bloc d'accès de TEST : à retirer avant la mise en ligne définitive ---
     Il suffit de supprimer tout le <div class="test-access">...</div>
     ci-dessous (et éventuellement ce commentaire) pour publier la version
     finale, sans aucune porte d'entrée vers le reste du site. */
  .test-access{
    margin-top:34px;
    padding-top:20px;
    border-top:1px dashed #E0CDA6;
  }
  .test-access .test-label{
    font-size:9.5px; letter-spacing:0.1em; text-transform:uppercase;
    color:#C9B48A; margin-bottom:8px;
  }
  .test-tile{
    display:inline-flex; align-items:center; justify-content:center;
    width:34px; height:34px;
    border-radius:8px;
    background:var(--creme);
    border:1px solid #EAD9BE;
    color:var(--terracotta);
    text-decoration:none;
    font-size:14px;
    transition: all .15s ease;
  }
  .test-tile:hover{ background:var(--terracotta); color:#fff; border-color:var(--terracotta); }

  @media (max-width:420px){
    .unit .num{ font-size:24px; }
  }
</style>
</head>
<body>

  <div class="card">
    <img class="frame-corner tl" src="asset/corner-tl.png" alt="">
    <img class="frame-corner tr" src="asset/corner-tr.png" alt="">
    <img class="frame-corner bl" src="asset/corner-bl.png" alt="">
    <img class="frame-corner br" src="asset/corner-br.png" alt="">
    <img class="frame-sprig" src="asset/sprig-right.png" alt="">

    <h1>Mariana &amp; Robin</h1>
    <div class="venue">Domaine Monmanoir</div>

    <div class="eyebrow">Le grand jour arrive dans</div>

    <div class="countdown">
      <div class="unit"><div class="num" id="cd-days">00</div><div class="label">jours</div></div>
      <div class="unit"><div class="num" id="cd-hours">00</div><div class="label">heures</div></div>
      <div class="unit"><div class="num" id="cd-mins">00</div><div class="label">min</div></div>
      <div class="unit"><div class="num" id="cd-secs">00</div><div class="label">sec</div></div>
    </div>

    <div class="date-line">15 mai 2027</div>
    <p class="sub-msg">Toutes les informations pratiques (plan, horaires, itinéraires) seront disponibles ici à l'approche du jour J.</p>

    <!-- ===================== BLOC DE TEST — à retirer avant publication ===================== -->
    <div class="test-access" id="testAccess" hidden>
      <div class="test-label">Accès test</div>
      <a class="test-tile" href="itineraire-mariage.html" title="Accéder au site (test)">→</a>
    </div>
    <!-- ===================================================================================== -->
  </div>

<script>
  const TARGET_DATE = new Date('2027-05-15T14:00:00+02:00');

  function pad(n){ return String(n).padStart(2,'0'); }

  function updateCountdown(){
    const now = new Date();
    let diff = TARGET_DATE - now;
    if (diff < 0) diff = 0;

    const days = Math.floor(diff / (1000*60*60*24));
    const hours = Math.floor((diff / (1000*60*60)) % 24);
    const mins = Math.floor((diff / (1000*60)) % 60);
    const secs = Math.floor((diff / 1000) % 60);

    document.getElementById('cd-days').textContent = days;
    document.getElementById('cd-hours').textContent = pad(hours);
    document.getElementById('cd-mins').textContent = pad(mins);
    document.getElementById('cd-secs').textContent = pad(secs);
  }

  // Accès test réservé à l'organisation : ajouter ?test à l'adresse de la page.
  if(new URLSearchParams(location.search).has('test')) document.getElementById('testAccess').hidden = false;

  updateCountdown();
  setInterval(updateCountdown, 1000);
</script>

<script>if('serviceWorker' in navigator && location.protocol!=='file:'){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}</script>
</body>
</html>
